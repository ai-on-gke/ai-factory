name: Reviewer Agent

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Install tool CLI
      run: go install ./tool/cmd/tool

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install gemini-cli
      run: npm install -g @google/gemini-cli

    - name: Run Reviewer Agent
      if: ${{ secrets.GEMINI_API_KEY != '' }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_CLI_TRUST_WORKSPACE: "true"
      run: |
        cat .agents/reviewer/agent.md | gemini --yolo

    - name: Skip Reviewer Agent (No API Key)
      if: ${{ secrets.GEMINI_API_KEY == '' }}
      run: |
        echo "GEMINI_API_KEY secret is not configured. Skipping Reviewer Agent execution."
