name: Go Coverage Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    steps:
    - name: Check skip label
      id: check-skip
      run: |
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'test/skip-coverage') }}" == "true" ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Checkout PR Code
      if: steps.check-skip.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        path: pr

    - name: Checkout Base Code
      if: steps.check-skip.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.base_ref }}
        path: base

    - name: Set up Go (PR)
      if: steps.check-skip.outputs.skip != 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: 'pr/go.mod'
        cache: true
        cache-dependency-path: 'pr/go.sum'

    - name: Run Coverage Check
      if: steps.check-skip.outputs.skip != 'true'
      env:
        MAX_REGRESSION: 1.0
      run: |
        bash pr/.github/scripts/check-coverage.sh

    - name: Report Skip
      if: steps.check-skip.outputs.skip == 'true'
      run: |
        echo "Coverage check is skipped because 'test/skip-coverage' label is applied."
